# Alertmanager for the compose stack (7.7, Decision AK). Alerts are emailed to Mailpit
# (http://localhost:8025): nothing leaves the machine. A real environment replaces the receivers
# (pager for critical, chat or ticket for warning) and keeps the routing.
# https://prometheus.io/docs/alerting/latest/configuration/
global:
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@novabank.local
  # Mailpit speaks plain SMTP; a real mail relay must use TLS (the default is true).
  smtp_require_tls: false

route:
  receiver: on-call
  # One notification per alert and service, not one per instance or per label change.
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: on-call
      repeat_interval: 1h
    - matchers:
        - severity="warning"
      receiver: team

receivers:
  - name: on-call
    email_configs:
      - to: on-call@novabank.local
        send_resolved: true
  - name: team
    email_configs:
      - to: team@novabank.local
        send_resolved: true

inhibit_rules:
  # A service that is down also has errors, lag and a backlog: page once, for the cause.
  - source_matchers:
      - alertname="ServiceDown"
    target_matchers:
      - alertname!="ServiceDown"
    equal: [service]
