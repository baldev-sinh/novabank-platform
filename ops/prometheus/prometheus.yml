# Prometheus for the compose stack (compose.yaml, profile "apps"). Scrapes each service's
# management port; Actuator is not exposed on the main port (Decision O).
# https://prometheus.io/docs/prometheus/latest/configuration/configuration/
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules as code, unit-tested in CI with promtool (Decision AK).
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: novabank
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auth-service:9081
          - customer-service:9082
          - account-service:9083
          - ledger-service:9084
          - payment-service:9085
          - audit-service:9086
          - notification-service:9087
    relabel_configs:
      # payment-service:9085 -> service="payment": what rules, alerts and dashboards group by.
      - source_labels: [__address__]
        regex: '(.+)-service:\d+'
        target_label: service
        replacement: '$1'
