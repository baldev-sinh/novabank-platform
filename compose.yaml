# Local development databases. Not used in production.
# Usage: docker compose up -d   (requires a .env file; see .env.example)
name: novabank

services:
  auth-db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: novabank_auth
      POSTGRES_USER: ${AUTH_DB_USERNAME:?Set AUTH_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  customer-db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: novabank_customer
      POSTGRES_USER: ${CUSTOMER_DB_USERNAME:?Set CUSTOMER_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD:?Set CUSTOMER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CUSTOMER_DB_PORT:-5434}:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  auth-db-data:
  customer-db-data:
