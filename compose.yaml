# Local stack. Not used in production. Requires a .env file (see .env.example).
#   docker compose up -d --wait                    infrastructure only (run services with mvnw)
#   docker compose --profile apps up -d --build --wait
#                                                  + all services, Prometheus and Jaeger
name: novabank

# Settings shared by the service containers (Decision X).
x-service: &service
  profiles: ["apps"]
  restart: unless-stopped
  # Spring's graceful shutdown gets 20 s per phase (Decision V); Compose's default is only 10 s.
  stop_grace_period: 30s
  mem_limit: 512m
  # Hardened like a production pod: nothing writable but /tmp, no privilege escalation, no caps.
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-service-env: &service-env
  APP_ENVIRONMENT: compose
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_REPLICATION_FACTOR: 1
  # Tokens are issued by auth; the issuer is the URL clients use, the JWKS URL the one containers use.
  AUTH_JWT_ISSUER: http://localhost:8081
  AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
  TRACING_SAMPLING_PROBABILITY: 1.0
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces

services:
  auth-db:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_DB: novabank_auth
      POSTGRES_USER: ${AUTH_DB_USERNAME:?Set AUTH_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  customer-db:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_DB: novabank_customer
      POSTGRES_USER: ${CUSTOMER_DB_USERNAME:?Set CUSTOMER_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD:?Set CUSTOMER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CUSTOMER_DB_PORT:-5434}:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  account-db:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_DB: novabank_account
      POSTGRES_USER: ${ACCOUNT_DB_USERNAME:?Set ACCOUNT_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Set ACCOUNT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ACCOUNT_DB_PORT:-5435}:5432"
    volumes:
      - account-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ledger-db:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_DB: novabank_ledger
      POSTGRES_USER: ${LEDGER_DB_USERNAME:?Set LEDGER_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD:?Set LEDGER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${LEDGER_DB_PORT:-5436}:5432"
    volumes:
      - ledger-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  payment-db:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_DB: novabank_payment
      POSTGRES_USER: ${PAYMENT_DB_USERNAME:?Set PAYMENT_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PAYMENT_DB_PORT:-5437}:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Single-node Kafka in KRaft mode (no ZooKeeper): this one process is broker and controller.
  audit-db:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_DB: novabank_audit
      POSTGRES_USER: ${AUDIT_DB_USERNAME:?Set AUDIT_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:?Set AUDIT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${AUDIT_DB_PORT:-5438}:5432"
    volumes:
      - audit-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # PLAINTEXT for clients on the host (localhost:9092), INTERNAL for containers (kafka:29092):
      # a broker hands out the advertised address, so each side needs one it can reach.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      # One broker, so internal topics can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the services with explicit settings, never implicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Catches all outgoing email locally (nothing is delivered). Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  auth-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: novabank-auth-service
        SERVER_PORT: 8081
        MANAGEMENT_PORT: 9081
    image: novabank/auth-service:dev
    environment:
      <<: *service-env
      AUTH_DB_URL: jdbc:postgresql://auth-db:5432/novabank_auth
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      # Throwaway key pair per start (tokens die with the container); production mounts PEM files.
      SECURITY_JWT_GENERATE_EPHEMERAL_KEY: "true"
      # First administrator once verified (2.10.1b); scripts/e2e signs in as this address.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@novabank.local}
      # The payment service may get service tokens for account status (7.3).
      SECURITY_SERVICECLIENTS_CLIENTS_0_CLIENTID: payment-service
      SECURITY_SERVICECLIENTS_CLIENTS_0_JWKSETURI: http://payment-service:8085/.well-known/jwks.json
      SECURITY_SERVICECLIENTS_CLIENTS_0_SCOPES_0: accounts:read
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_STARTTLS_REQUIRED: "false"
      VERIFICATION_LINK_TEMPLATE: http://localhost:4200/verify-email#token={token}
      # Every request reaches auth from the same Docker gateway IP, so the production per-IP limits
      # would stop scripts/e2e after a couple of runs. Same rules, roomier (replaces the whole list).
      SPRING_APPLICATION_JSON: >-
        {"security":{"rate-limit":{"rules":[
        {"name":"login","path":"/api/v1/auth/login","capacity":100,"period":"1m"},
        {"name":"register","path":"/api/v1/users/register","capacity":100,"period":"1h"},
        {"name":"verify-email","path":"/api/v1/users/verify-email","capacity":100,"period":"1h"},
        {"name":"resend-verification","path":"/api/v1/users/verify-email/resend","capacity":100,"period":"1h"},
        {"name":"refresh","path":"/api/v1/auth/refresh","capacity":100,"period":"1m"}]}}}
    ports:
      # Main port only; Actuator (management port) stays inside the compose network.
      - "127.0.0.1:8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started

  customer-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: novabank-customer-service
        SERVER_PORT: 8082
        MANAGEMENT_PORT: 9082
    image: novabank/customer-service:dev
    environment:
      <<: *service-env
      CUSTOMER_DB_URL: jdbc:postgresql://customer-db:5432/novabank_customer
      CUSTOMER_DB_USERNAME: ${CUSTOMER_DB_USERNAME}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
    ports:
      # Main port only; Actuator (management port) stays inside the compose network.
      - "127.0.0.1:8082:8082"
    depends_on:
      customer-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  account-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: novabank-account-service
        SERVER_PORT: 8083
        MANAGEMENT_PORT: 9083
    image: novabank/account-service:dev
    environment:
      <<: *service-env
      ACCOUNT_DB_URL: jdbc:postgresql://account-db:5432/novabank_account
      ACCOUNT_DB_USERNAME: ${ACCOUNT_DB_USERNAME}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD}
    ports:
      # Main port only; Actuator (management port) stays inside the compose network.
      - "127.0.0.1:8083:8083"
    depends_on:
      account-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ledger-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: novabank-ledger-service
        SERVER_PORT: 8084
        MANAGEMENT_PORT: 9084
    image: novabank/ledger-service:dev
    environment:
      <<: *service-env
      LEDGER_DB_URL: jdbc:postgresql://ledger-db:5432/novabank_ledger
      LEDGER_DB_USERNAME: ${LEDGER_DB_USERNAME}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD}
    ports:
      # Main port only; Actuator (management port) stays inside the compose network.
      - "127.0.0.1:8084:8084"
    depends_on:
      ledger-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: novabank-payment-service
        SERVER_PORT: 8085
        MANAGEMENT_PORT: 9085
    image: novabank/payment-service:dev
    environment:
      <<: *service-env
      PAYMENT_DB_URL: jdbc:postgresql://payment-db:5432/novabank_payment
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      # Deposit readiness check (7.3): service token from auth, then the account service.
      AUTH_TOKEN_URI: http://auth-service:8081/oauth2/token
      ACCOUNT_SERVICE_URL: http://account-service:8083
      SERVICE_GENERATE_EPHEMERAL_KEY: "true"
    ports:
      # Main port only; Actuator (management port) stays inside the compose network.
      - "127.0.0.1:8085:8085"
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  audit-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE: novabank-audit-service
        SERVER_PORT: 8086
        MANAGEMENT_PORT: 9086
    image: novabank/audit-service:dev
    environment:
      <<: *service-env
      AUDIT_DB_URL: jdbc:postgresql://audit-db:5432/novabank_audit
      AUDIT_DB_USERNAME: ${AUDIT_DB_USERNAME}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD}
      AUDIT_CHAIN_KEY: ${AUDIT_CHAIN_KEY:?Set AUDIT_CHAIN_KEY in .env (openssl rand -base64 32)}
    ports:
      # Main port only; Actuator (management port) stays inside the compose network.
      - "127.0.0.1:8086:8086"
    depends_on:
      audit-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Scrapes every service's /actuator/prometheus on its management port. UI: http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["apps"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  # Receives the services' traces over OTLP/HTTP; in-memory storage. UI: http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: ["apps"]
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"

volumes:
  auth-db-data:
  customer-db-data:
  account-db-data:
  ledger-db-data:
  payment-db-data:
  audit-db-data:
  kafka-data:
