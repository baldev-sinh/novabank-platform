# Passed to every service. The services trust X-Forwarded-For only from internal proxies, which
# this container is, so per-IP rate limits (auth) see the real client.
proxy_http_version 1.1;
# The browser's Host exactly, port included. ($host drops the port: the services then see
# Origin http://localhost:4200 on host "localhost", take the call for cross-origin and refuse it.)
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# With X-Forwarded-Proto but no port header, Tomcat's RemoteIpValve reports port 80, and CORS then
# takes http://localhost:4200 for another origin. Boot reads X-Forwarded-Port by default.
proxy_set_header X-Forwarded-Port $nb_forwarded_port;
proxy_set_header Connection "";

proxy_connect_timeout 3s;
proxy_read_timeout 15s;
