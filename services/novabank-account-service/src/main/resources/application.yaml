server:
  port: 8083

spring:
  application:
    name: novabank-account-service

  datasource:
    url: ${ACCOUNT_DB_URL}
    username: ${ACCOUNT_DB_USERNAME}
    password: ${ACCOUNT_DB_PASSWORD}
    hikari:
      pool-name: account-db-pool
      maximum-pool-size: ${ACCOUNT_DB_POOL_SIZE:10}
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      group-id: account-service
      # A new consumer group starts from the oldest event, so no verified customer is missed.
      auto-offset-reset: earliest
    listener:
      # Up to one thread per partition of the source topic.
      concurrency: 3
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Kafka requires delivery.timeout.ms >= linger.ms + request.timeout.ms.
        request.timeout.ms: 10000
        delivery.timeout.ms: 20000

novabank:
  outbox:
    enabled: true
    # Longer than delivery.timeout.ms, so the relay always sees the producer's final result.
    send-timeout: 25s

accounts:
  supported-currencies: INR, EUR, USD, GBP

events:
  account-events:
    topic: account.events.v1
    partitions: 3
    replication-factor: ${KAFKA_REPLICATION_FACTOR:3}
  customer-events-topic: customer.events.v1
  dead-letter-replication-factor: ${KAFKA_REPLICATION_FACTOR:3}

security:
  jwt:
    # Access tokens are issued by the auth service; only its public keys are needed here.
    jwk-set-uri: ${AUTH_JWKS_URI:}
    issuer: ${AUTH_JWT_ISSUER:}
    audience: novabank-api

management:
  endpoints:
    web:
      exposure:
        include: health, info
