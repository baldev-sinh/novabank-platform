server:
  port: 8081

spring:
  application:
    name: novabank-auth-service

  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    hikari:
      pool-name: auth-db-pool
      maximum-pool-size: ${AUTH_DB_POOL_SIZE:10}
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

security:
  jwt:
    issuer: novabank-auth-service
    secret: ${AUTH_JWT_SECRET}
    expiration: 900

management:
  endpoints:
    web:
      exposure:
        include: health, info
