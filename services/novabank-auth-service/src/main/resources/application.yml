server:
  port: 8081

spring:
  application:
    name: novabank-auth-service

  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    hikari:
      pool-name: auth-db-pool
      maximum-pool-size: ${AUTH_DB_POOL_SIZE:10}
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    producer:
      # Wait until all in-sync replicas have the event before calling it sent.
      acks: all
      properties:
        # Broker drops duplicates caused by producer retries (default since Kafka 3.0; explicit
        # here because the outbox relies on it).
        enable.idempotence: true
        # Keep retrying one send for up to 20 s, then give up (the relay retries on its next run).
        # Kafka requires delivery.timeout.ms >= linger.ms + request.timeout.ms.
        request.timeout.ms: 10000
        delivery.timeout.ms: 20000

  mail:
    # Required: startup fails without it instead of silently never sending emails.
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      # Never send credentials or links over an unencrypted connection.
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": ${MAIL_STARTTLS_REQUIRED:true}
      # JavaMail's defaults are infinite, so a hung mail server would block a thread forever.
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  # Executor for @Async (verification emails). Bounded queue so a mail outage can't use up memory.
  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 500
      shutdown:
        # Send queued emails before the JVM exits.
        await-termination: true
        await-termination-period: 10s

outbox:
  topic: auth.user-events.v1
  partitions: 3
  replication-factor: ${KAFKA_REPLICATION_FACTOR:3}
  batch-size: 100
  # Longer than delivery.timeout.ms, so the relay always sees the producer's final result.
  send-timeout: 25s

verification:
  email:
    token-ttl: 24h
    resend-cooldown: 60s
    from: ${MAIL_FROM:no-reply@novabank.example}
    link-template: ${VERIFICATION_LINK_TEMPLATE}

security:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:}
    audience: novabank-api
    access-token-ttl: 15m
    # PEM files, e.g. file:/run/secrets/jwt-private.pem (mounted from a secret store)
    private-key-location: ${AUTH_JWT_PRIVATE_KEY_LOCATION:}
    public-key-location: ${AUTH_JWT_PUBLIC_KEY_LOCATION:}

management:
  endpoints:
    web:
      exposure:
        include: health, info
