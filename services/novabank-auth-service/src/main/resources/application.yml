server:
  port: 8081
  # Use X-Forwarded-For only from internal proxies (Tomcat RemoteIpValve), so rate limits see the
  # real client IP behind the ingress and a client cannot fake it.
  forward-headers-strategy: native

spring:
  application:
    name: novabank-auth-service

  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    hikari:
      pool-name: auth-db-pool
      maximum-pool-size: ${AUTH_DB_POOL_SIZE:10}
      connection-timeout: 5000
      # Fail fast on a dead connection; HikariCP requires it below connection-timeout.
      validation-timeout: 2000
      # minimum-idle is deliberately unset: it then equals maximum-pool-size, a fixed-size pool
      # (HikariCP advice: no ramp-up latency under a traffic spike).
      # Retire connections a few seconds before any database, proxy or firewall cutoff.
      max-lifetime: ${AUTH_DB_MAX_LIFETIME_MS:1800000}
      # Ping idle connections so a silent network drop is found before a request hits it.
      keepalive-time: 120000
      data-source-properties:
        # TCP keepalive too, so the pool cannot hang on half-open sockets (HikariCP README).
        tcpKeepAlive: true

  lifecycle:
    # Graceful shutdown is on by default: on SIGTERM readiness goes to REFUSING_TRAFFIC, new
    # requests are refused and in-flight ones get this long per phase to finish. Keep the pod's
    # terminationGracePeriodSeconds above preStop sleep + this value.
    timeout-per-shutdown-phase: 20s

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    producer:
      # Wait until all in-sync replicas have the event before calling it sent.
      acks: all
      properties:
        # Broker drops duplicates caused by producer retries (default since Kafka 3.0; explicit
        # here because the outbox relies on it).
        enable.idempotence: true
        # Keep retrying one send for up to 20 s, then give up (the relay retries on its next run).
        # Kafka requires delivery.timeout.ms >= linger.ms + request.timeout.ms.
        request.timeout.ms: 10000
        delivery.timeout.ms: 20000

  mail:
    # Required: startup fails without it instead of silently never sending emails.
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      # Never send credentials or links over an unencrypted connection.
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": ${MAIL_STARTTLS_REQUIRED:true}
      # JavaMail's defaults are infinite, so a hung mail server would block a thread forever.
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  # Executor for @Async (verification emails). Bounded queue so a mail outage can't use up memory.
  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 500
      shutdown:
        # Send queued emails before the JVM exits.
        await-termination: true
        await-termination-period: 10s
    scheduling:
      shutdown:
        # Let a running scheduled job (outbox relay batch) finish instead of being interrupted.
        await-termination: true
        await-termination-period: 10s

events:
  user-events:
    topic: auth.user-events.v1
    partitions: 3
    replication-factor: ${KAFKA_REPLICATION_FACTOR:3}

novabank:
  outbox:
    enabled: true
    batch-size: 100
    # Longer than delivery.timeout.ms, so the relay always sees the producer's final result.
    send-timeout: 25s

verification:
  email:
    token-ttl: 24h
    resend-cooldown: 60s
    from: ${MAIL_FROM:no-reply@novabank.example}
    link-template: ${VERIFICATION_LINK_TEMPLATE}

security:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:}
    audience: novabank-api
    access-token-ttl: 15m
    # PEM files, e.g. file:/run/secrets/jwt-private.pem (mounted from a secret store)
    private-key-location: ${AUTH_JWT_PRIVATE_KEY_LOCATION:}
    public-key-location: ${AUTH_JWT_PUBLIC_KEY_LOCATION:}
  login:
    # Account lockout (Decision S): temporary, so nobody can lock a user out for good.
    max-failed-attempts: 5
    failure-window: 15m
    lockout-duration: 15m
  rate-limit:
    # Per client IP, shared by all instances (Decision T). The ingress should limit too.
    enabled: true
    rules:
      - name: login
        path: /api/v1/auth/login
        capacity: 10
        period: 1m
      - name: register
        path: /api/v1/users/register
        capacity: 5
        period: 1h
      - name: verify-email
        path: /api/v1/users/verify-email
        capacity: 10
        period: 1h
      - name: resend-verification
        path: /api/v1/users/verify-email/resend
        capacity: 5
        period: 1h

logging:
  structured:
    # One JSON object per line (Elastic Common Schema); includes the MDC, so traceId/spanId too.
    format:
      console: ecs

management:
  server:
    # Actuator lives on its own port: the ingress only routes the main port, so metrics and
    # health details are reachable only from inside the cluster (Prometheus, kubelet).
    port: ${MANAGEMENT_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        # Also serve /livez and /readyz on the main port, so a probe fails if the main
        # server stops answering (the management port alone could stay healthy).
        add-additional-paths: true
      group:
        readiness:
          # Every request needs the database; liveness must never depend on it.
          include: readinessState, db
  otlp:
    metrics:
      export:
        # Prometheus scrapes /actuator/prometheus (Decision V). Without this the OTLP registry that
        # comes with the OpenTelemetry starter pushes to localhost:4318 and logs a failure every minute.
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}
  tracing:
    sampling:
      # 10% is Boot's default; set 1.0 locally to see every trace.
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  metrics:
    tags:
      # Tag every meter, so dashboards can filter per environment.
      environment: ${APP_ENVIRONMENT:local}
