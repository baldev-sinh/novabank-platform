# Local development overrides, loaded only when the "local" profile is active
# (SPRING_PROFILES_ACTIVE=local). Never activate this profile outside a developer machine.
spring:
  config:
    import:
      # Credentials from the repository-root .env (also used by compose.yaml).
      # Two paths: one for running from the repo root, one for running from this module.
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${AUTH_DB_PORT:5433}/novabank_auth

logging:
  level:
    org.hibernate.SQL: debug
