# Local development overrides, loaded only when the "local" profile is active
# (SPRING_PROFILES_ACTIVE=local). Never activate this profile outside a developer machine.
spring:
  config:
    import:
      # Credentials from the repository-root .env (also used by compose.yaml).
      # Two paths: one for running from the repo root, one for running from this module.
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${AUTH_DB_PORT:5433}/novabank_auth

  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}

  # Mailpit from compose.yaml catches all mail; read it at http://localhost:8025
  mail:
    host: localhost
    port: ${MAILPIT_SMTP_PORT:1025}
    properties:
      "[mail.smtp.auth]": false
      "[mail.smtp.starttls.enable]": false
      "[mail.smtp.starttls.required]": false

events:
  user-events:
    # A single local broker can only hold one copy.
    replication-factor: 1

verification:
  email:
    link-template: http://localhost:4200/verify-email#token={token}

security:
  rate-limit:
    # Same rules, roomier: the e2e script registers and signs in several users from localhost.
    rules:
      - name: login
        path: /api/v1/auth/login
        capacity: 100
        period: 1m
      - name: register
        path: /api/v1/users/register
        capacity: 100
        period: 1h
      - name: verify-email
        path: /api/v1/users/verify-email
        capacity: 100
        period: 1h
      - name: resend-verification
        path: /api/v1/users/verify-email/resend
        capacity: 100
        period: 1h
  jwt:
    issuer: http://localhost:8081
    # Throwaway key pair per start; set the key locations instead to keep tokens across restarts.
    generate-ephemeral-key: true

logging:
  structured:
    format:
      # Plain text on a developer console; JSON everywhere else.
      console: ""
  level:
    org.hibernate.SQL: debug

management:
  tracing:
    sampling:
      probability: 1.0
