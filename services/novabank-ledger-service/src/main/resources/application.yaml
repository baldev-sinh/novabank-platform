server:
  port: 8084

spring:
  application:
    name: novabank-ledger-service

  datasource:
    url: ${LEDGER_DB_URL}
    username: ${LEDGER_DB_USERNAME}
    password: ${LEDGER_DB_PASSWORD}
    hikari:
      pool-name: ledger-db-pool
      maximum-pool-size: ${LEDGER_DB_POOL_SIZE:10}
      connection-timeout: 5000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
    listener:
      concurrency: 3
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Kafka requires delivery.timeout.ms >= linger.ms + request.timeout.ms.
        request.timeout.ms: 10000
        delivery.timeout.ms: 20000

novabank:
  outbox:
    enabled: true
    # Longer than delivery.timeout.ms, so the relay always sees the producer's final result.
    send-timeout: 25s

events:
  ledger-events: ledger.events.v1
  ledger-commands: ledger.commands.v1
  account-events-topic: account.events.v1
  partitions: 3
  replication-factor: ${KAFKA_REPLICATION_FACTOR:3}

security:
  jwt:
    # Access tokens are issued by the auth service; only its public keys are needed here.
    jwk-set-uri: ${AUTH_JWKS_URI:}
    issuer: ${AUTH_JWT_ISSUER:}
    audience: novabank-api

management:
  endpoints:
    web:
      exposure:
        include: health, info
