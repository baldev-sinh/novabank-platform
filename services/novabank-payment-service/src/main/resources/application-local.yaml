# Local development overrides, loaded only when the "local" profile is active
# (SPRING_PROFILES_ACTIVE=local). Never activate this profile outside a developer machine.
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${PAYMENT_DB_PORT:5437}/novabank_payment

  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}

events:
  # A single local broker can only hold one copy.
  replication-factor: 1

security:
  jwt:
    jwk-set-uri: http://localhost:8081/.well-known/jwks.json
    issuer: http://localhost:8081

# Service token from the local auth (which fetches this service's throwaway key from its JWKS).
spring.security.oauth2.client.provider.novabank-auth.token-uri: http://localhost:8081/oauth2/token
novabank:
  service-identity:
    generate-ephemeral-key: true
    auth-issuer: http://localhost:8081
  account-service:
    base-url: http://localhost:8083

logging:
  structured:
    format:
      # Plain text on a developer console; JSON everywhere else.
      console: ""

management:
  tracing:
    sampling:
      probability: 1.0

springdoc:
  # API docs and Swagger UI for local development: http://localhost:<port>/swagger-ui.html
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
