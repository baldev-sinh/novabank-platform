server:
  port: 8085

spring:
  application:
    name: novabank-payment-service

  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    hikari:
      pool-name: payment-db-pool
      maximum-pool-size: ${PAYMENT_DB_POOL_SIZE:10}
      connection-timeout: 5000
      # Fail fast on a dead connection; HikariCP requires it below connection-timeout.
      validation-timeout: 2000
      # minimum-idle is deliberately unset: it then equals maximum-pool-size, a fixed-size pool
      # (HikariCP advice: no ramp-up latency under a traffic spike).
      # Retire connections a few seconds before any database, proxy or firewall cutoff.
      max-lifetime: ${PAYMENT_DB_MAX_LIFETIME_MS:1800000}
      # Ping idle connections so a silent network drop is found before a request hits it.
      keepalive-time: 120000
      data-source-properties:
        # TCP keepalive too, so the pool cannot hang on half-open sockets (HikariCP README).
        tcpKeepAlive: true

  # This service's client for service tokens (7.3, Decision AF): client_credentials from auth,
  # authenticated with private_key_jwt (no client secret). Scope accounts:read for the deposit check.
  security:
    oauth2:
      client:
        registration:
          account-service:
            provider: novabank-auth
            client-id: payment-service
            authorization-grant-type: client_credentials
            client-authentication-method: private_key_jwt
            scope: accounts:read
        provider:
          novabank-auth:
            token-uri: ${AUTH_TOKEN_URI}

  lifecycle:
    # Graceful shutdown is on by default: on SIGTERM readiness goes to REFUSING_TRAFFIC, new
    # requests are refused and in-flight ones get this long per phase to finish. Keep the pod's
    # terminationGracePeriodSeconds above preStop sleep + this value.
    timeout-per-shutdown-phase: 20s

  task:
    scheduling:
      shutdown:
        # Let a running scheduled job (outbox relay batch) finish instead of being interrupted.
        await-termination: true
        await-termination-period: 10s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
    listener:
      # Continue the producer's trace (traceparent header) in the consumer and its logs.
      observation-enabled: true
      concurrency: 3
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Kafka requires delivery.timeout.ms >= linger.ms + request.timeout.ms.
        request.timeout.ms: 10000
        delivery.timeout.ms: 20000

novabank:
  # The key this service signs its client assertions with; auth fetches the public half from
  # /.well-known/jwks.json. Real environments mount the PEM files from the secret store.
  service-identity:
    private-key-location: ${SERVICE_PRIVATE_KEY_LOCATION:}
    public-key-location: ${SERVICE_PUBLIC_KEY_LOCATION:}
    generate-ephemeral-key: ${SERVICE_GENERATE_EPHEMERAL_KEY:false}
    auth-issuer: ${AUTH_JWT_ISSUER:}
  # Deposit readiness check (7.3): timeouts and circuit breaker (Decision AG).
  account-service:
    base-url: ${ACCOUNT_SERVICE_URL}
    connect-timeout: 1s
    read-timeout: 2s
  outbox:
    enabled: true
    # Longer than delivery.timeout.ms, so the relay always sees the producer's final result.
    send-timeout: 25s

payments:
  step-timeout: 30s
  max-attempts: 10
  max-amount: 1000000
  sweeper:
    interval-ms: 5000

events:
  payment-events: payment.events.v1
  account-commands: account.commands.v1
  ledger-commands: ledger.commands.v1
  account-events-topic: account.events.v1
  ledger-events-topic: ledger.events.v1
  partitions: 3
  replication-factor: ${KAFKA_REPLICATION_FACTOR:3}

security:
  jwt:
    # Access tokens are issued by the auth service; only its public keys are needed here.
    jwk-set-uri: ${AUTH_JWKS_URI:}
    issuer: ${AUTH_JWT_ISSUER:}
    audience: novabank-api

logging:
  structured:
    # One JSON object per line (Elastic Common Schema); includes the MDC, so traceId/spanId too.
    format:
      console: ecs

management:
  server:
    # Actuator lives on its own port: the ingress only routes the main port, so metrics and
    # health details are reachable only from inside the cluster (Prometheus, kubelet).
    port: ${MANAGEMENT_PORT:9085}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        # Also serve /livez and /readyz on the main port, so a probe fails if the main
        # server stops answering (the management port alone could stay healthy).
        add-additional-paths: true
      group:
        readiness:
          # Every request needs the database; liveness must never depend on it.
          include: readinessState, db
  otlp:
    metrics:
      export:
        # Prometheus scrapes /actuator/prometheus (Decision V). Without this the OTLP registry that
        # comes with the OpenTelemetry starter pushes to localhost:4318 and logs a failure every minute.
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}
  tracing:
    sampling:
      # 10% is Boot's default; set 1.0 locally to see every trace.
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  metrics:
    tags:
      # Tag every meter, so dashboards can filter per environment.
      environment: ${APP_ENVIRONMENT:local}

springdoc:
  # Off unless API_DOCS_ENABLED=true (the local profile turns them on): elsewhere they would publish
  # the whole API surface to anyone who can reach the port.
  # https://springdoc.org/properties.html
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
