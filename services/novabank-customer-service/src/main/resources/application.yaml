server:
  port: 8082

spring:
  application:
    name: novabank-customer-service

  datasource:
    url: ${CUSTOMER_DB_URL}
    username: ${CUSTOMER_DB_USERNAME}
    password: ${CUSTOMER_DB_PASSWORD}
    hikari:
      pool-name: customer-db-pool
      maximum-pool-size: ${CUSTOMER_DB_POOL_SIZE:10}
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      group-id: customer-service
      # A new consumer group starts from the oldest event, so no registration is missed.
      auto-offset-reset: earliest
    listener:
      # Continue the producer's trace (traceparent header) in the consumer and its logs.
      observation-enabled: true
      # Up to one thread per partition of the source topic.
      concurrency: 3

novabank:
  outbox:
    enabled: true

events:
  customer-events:
    topic: customer.events.v1
    partitions: 3
    replication-factor: ${KAFKA_REPLICATION_FACTOR:3}
  user-events-topic: auth.user-events.v1
  # Partitions of the dead-letter topic: at least those of the source topic, because a failed
  # record is sent to the same partition number.
  dead-letter-partitions: 3
  dead-letter-replication-factor: ${KAFKA_REPLICATION_FACTOR:3}

security:
  jwt:
    # Access tokens are issued by the auth service; only its public keys are needed here.
    jwk-set-uri: ${AUTH_JWKS_URI:}
    issuer: ${AUTH_JWT_ISSUER:}
    audience: novabank-api

logging:
  structured:
    # One JSON object per line (Elastic Common Schema); includes the MDC, so traceId/spanId too.
    format:
      console: ecs

management:
  server:
    # Actuator lives on its own port: the ingress only routes the main port, so metrics and
    # health details are reachable only from inside the cluster (Prometheus, kubelet).
    port: ${MANAGEMENT_PORT:9082}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        # Also serve /livez and /readyz on the main port, so a probe fails if the main
        # server stops answering (the management port alone could stay healthy).
        add-additional-paths: true
      group:
        readiness:
          # Every request needs the database; liveness must never depend on it.
          include: readinessState, db
  tracing:
    sampling:
      # 10% is Boot's default; set 1.0 locally to see every trace.
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  metrics:
    tags:
      # Tag every meter, so dashboards can filter per environment.
      environment: ${APP_ENVIRONMENT:local}
