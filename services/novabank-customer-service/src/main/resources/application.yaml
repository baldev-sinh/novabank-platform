server:
  port: 8082

spring:
  application:
    name: novabank-customer-service

  datasource:
    url: ${CUSTOMER_DB_URL}
    username: ${CUSTOMER_DB_USERNAME}
    password: ${CUSTOMER_DB_PASSWORD}
    hikari:
      pool-name: customer-db-pool
      maximum-pool-size: ${CUSTOMER_DB_POOL_SIZE:10}
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

security:
  jwt:
    # Access tokens are issued by the auth service; only its public keys are needed here.
    jwk-set-uri: ${AUTH_JWKS_URI:}
    issuer: ${AUTH_JWT_ISSUER:}
    audience: novabank-api

management:
  endpoints:
    web:
      exposure:
        include: health, info
