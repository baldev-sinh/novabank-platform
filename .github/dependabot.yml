# Dependabot (Decision Z): weekly minor/patch updates, grouped per ecosystem so each week is a few
# PRs that CI (ci.yml) verifies. Major versions are ignored here: each one is a planned roadmap
# phase (CLAUDE.md). Security updates are not affected by `ignore` and still arrive for any version.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # Root POM: Spring Boot BOM, libraries outside it, build plugins.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  # Base images in the shared Dockerfile (JDK build stage, JRE runtime).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  # Images in compose.yaml (PostgreSQL, Kafka, Mailpit, Prometheus, Jaeger).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      compose-images:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  # Workflow actions (pinned to commit SHAs; Dependabot bumps the SHA).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: ci
      include: scope

  # Frontend. Angular majors (19 -> 22) are roadmap step 5.1, done with `ng update`.
  - package-ecosystem: npm
    directory: /frontend/novabank-web
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Angular pins the TypeScript and zone.js ranges it supports (angular.dev/reference/versions),
      # so a minor bump of either can break `npm ci`. Patches still come; minors and majors move
      # with `ng update`.
      - dependency-name: typescript
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: zone.js
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
