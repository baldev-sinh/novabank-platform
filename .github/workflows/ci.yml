# CI (Decision Y): the same `./mvnw -B clean verify` as locally (unit + Testcontainers ITs,
# Spotless, JaCoCo coverage gate), the Angular app's build and Vitest specs, then every service image is
# built from the jars the verify job tested.
# Actions are pinned to full commit SHAs (version in the comment); Dependabot keeps them current.
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: nothing in this workflow writes to the repository or a registry.
permissions:
  contents: read

# A new push to the same PR cancels the run it supersedes; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build and test
    # Pinned instead of ubuntu-latest, which is moving to 26.04: the runner changes in its own PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The wrapper's Maven distribution, cached per version: Central's CDN repeatedly answered 404
      # for the Maven zip on runners (worst right after a release), so it is fetched once.
      - name: Cache Maven wrapper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      # On a cache miss: repo.maven.apache.org twice, then repo1.maven.org (Maven Central's other
      # host, through the wrapper's MVNW_REPOURL). The wrapper verifies distributionSha256Sum.
      - name: Fetch Maven
        run: |
          for repo in "" "" "https://repo1.maven.org/maven2"; do
            MVNW_REPOURL="$repo" ./mvnw -B -q -v > /dev/null && exit 0
            echo "::warning::Maven download failed from ${repo:-Maven Central}, retrying"
            sleep 10
          done
          exit 1

      # Docker is preinstalled on the runner, so Testcontainers starts PostgreSQL, Kafka and Mailpit.
      - name: Verify
        run: ./mvnw -B -ntp clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

      # The images ship exactly these tested jars (build once). Maven Central kept answering 404
      # to Maven inside image builds on the runners, so the image job doesn't run Maven at all.
      - name: Upload service jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-jars
          path: services/*/target/novabank-*-service-*.jar
          if-no-files-found: error
          retention-days: 3

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/'
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/novabank-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 26: the newest LTS line, supported by Angular 22 (^22.22.3 || ^24.15.0 || ^26.0.0,
      # angular.dev/reference/versions).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/novabank-web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # Vitest with jsdom (Angular's unit-test builder); no browser needed.
      - name: Test
        run: npx ng test --watch=false

  image:
    name: Image (${{ matrix.service }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: auth, port: 8081, management-port: 9081 }
          - { service: customer, port: 8082, management-port: 9082 }
          - { service: account, port: 8083, management-port: 9083 }
          - { service: ledger, port: 8084, management-port: 9084 }
          - { service: payment, port: 8085, management-port: 9085 }
          - { service: audit, port: 8086, management-port: 9086 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download service jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: service-jars
          path: jars-download

      - name: Pick this service's jar
        run: |
          mkdir -p ci-jars
          cp jars-download/novabank-${{ matrix.service }}-service/target/novabank-${{ matrix.service }}-service-*.jar             ci-jars/novabank-${{ matrix.service }}-service.jar

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only: pushing to a registry comes with the first deployment target.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-contexts: jars=ci-jars
          build-args: |
            JAR_SOURCE=prebuilt
            SERVICE=novabank-${{ matrix.service }}-service
            SERVER_PORT=${{ matrix.port }}
            MANAGEMENT_PORT=${{ matrix.management-port }}
          tags: novabank/${{ matrix.service }}-service:ci
          push: false
          # One cache scope per image, otherwise each matrix build overwrites the others' cache.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # The whole stack in compose with the tested jars, then the cross-service money flow (6.1).
  e2e:
    name: End-to-end
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download service jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: service-jars
          path: jars-download

      # Same images compose would build, but from the jars the verify job tested (JAR_SOURCE=prebuilt).
      - name: Build images
        run: |
          mkdir -p ci-jars
          i=1
          for svc in auth customer account ledger payment audit; do
            cp jars-download/novabank-$svc-service/target/novabank-$svc-service-*.jar ci-jars/novabank-$svc-service.jar
            docker build -q --build-context jars=ci-jars --build-arg JAR_SOURCE=prebuilt \
              --build-arg SERVICE=novabank-$svc-service \
              --build-arg SERVER_PORT=808$i --build-arg MANAGEMENT_PORT=908$i \
              -t novabank/$svc-service:dev .
            i=$((i + 1))
          done

      # Throwaway credentials for databases that live only as long as this job; no secrets.
      - name: Create .env
        run: |
          for db in AUTH CUSTOMER ACCOUNT LEDGER PAYMENT AUDIT; do
            name=$(echo "$db" | tr '[:upper:]' '[:lower:]')
            echo "${db}_DB_USERNAME=novabank_$name" >> .env
            echo "${db}_DB_PASSWORD=ci-$(openssl rand -hex 12)" >> .env
          done
          echo "AUDIT_CHAIN_KEY=$(openssl rand -base64 32)" >> .env

      - name: Start the stack
        run: docker compose --profile apps up -d --no-build --wait --wait-timeout 300

      - name: Money flow
        run: scripts/e2e/money-flow.sh

      - name: Service logs
        if: failure()
        run: docker compose --profile apps logs --no-color --tail 300

      - name: Stop the stack
        if: always()
        run: docker compose --profile apps down -v
